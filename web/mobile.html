<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Agroserwis Serwis</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f1f5f9;color:#1e293b;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.topbar-back{font-size:1.4rem;cursor:pointer;padding:2px 10px 2px 0;display:none;line-height:1}
.topbar-info{flex:1;min-width:0}
.topbar-title{font-size:1.05rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-sub{font-size:.7rem;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.bottomnav{background:#fff;border-top:1px solid #e2e8f0;display:flex;flex-shrink:0}
.nav-btn{flex:1;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:#94a3b8;font-size:.65rem;font-weight:600;border:none;background:none;transition:color .15s}
.nav-btn.active{color:#16a34a}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Cards & Sections */
.section{background:#fff;margin:10px 12px 0;border-radius:14px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.section-title{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #f1f5f9}
.row:last-child{border-bottom:none}
.row-label{font-size:.82rem;color:#64748b;flex-shrink:0}
.row-val{font-size:.88rem;font-weight:700;color:#1e293b;text-align:right;min-width:0;word-break:break-word;padding-left:8px}

/* Form inputs */
.field{margin-bottom:13px}
.field label{font-size:.72rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;padding:10px 12px;border:2px solid #e2e8f0;border-radius:10px;font-size:.93rem;color:#1e293b;background:#fff;outline:none;transition:border-color .15s;font-family:inherit}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#16a34a}
.field textarea{resize:vertical;min-height:70px}

/* Buttons */
.btn-green{width:100%;padding:13px;background:#16a34a;color:#fff;border:none;border-radius:11px;font-size:.95rem;font-weight:800;cursor:pointer;margin-top:4px}
.btn-green:active{background:#15803d}
.btn-outline{width:100%;padding:11px;background:#fff;color:#16a34a;border:2px solid #16a34a;border-radius:11px;font-size:.9rem;font-weight:700;cursor:pointer;margin-top:8px}
.btn-danger{width:100%;padding:11px;background:#fff;color:#ef4444;border:2px solid #fecaca;border-radius:11px;font-size:.88rem;font-weight:700;cursor:pointer;margin-top:8px}
.btn-sm{padding:7px 14px;border-radius:8px;font-size:.8rem;font-weight:700;cursor:pointer;border:none}
.btn-sm-green{background:#16a34a;color:#fff}
.btn-sm-red{background:#fff;color:#ef4444;border:1.5px solid #fecaca}

/* Lista */
.search-wrap{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e2e8f0}
.search-bar{padding:10px 12px;display:flex;gap:8px}
.search-input{flex:1;border:1.5px solid #e2e8f0;border-radius:10px;padding:8px 12px;font-size:.9rem;outline:none;background:#f8fafc}
.search-input:focus{border-color:#16a34a}
.filter-scroll{display:flex;gap:8px;padding:6px 12px 10px;overflow-x:auto}
.filter-scroll::-webkit-scrollbar{display:none}
.chip{padding:5px 14px;border-radius:100px;font-size:.78rem;font-weight:700;border:2px solid #e2e8f0;background:#fff;cursor:pointer;white-space:nowrap;color:#64748b;transition:all .15s}
.chip.active{background:#16a34a;border-color:#16a34a;color:#fff}
.card{background:#fff;margin:10px 12px 0;border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);cursor:pointer;transition:transform .1s}
.card:active{transform:scale(.98)}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.card-numer{font-family:monospace;font-size:.85rem;font-weight:900;color:#16a34a}
.card-status{font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:100px}
.card-klient{font-size:.95rem;font-weight:700}
.card-sprzet{font-size:.8rem;color:#64748b;margin-top:2px}
.card-date{font-size:.72rem;color:#94a3b8;margin-top:5px}
.empty{text-align:center;padding:60px 24px;color:#94a3b8}
.empty-icon{font-size:3rem;margin-bottom:12px}
.loading{text-align:center;padding:40px;color:#94a3b8;font-size:.9rem}

/* Parts */
.parte-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9;gap:8px}
.parte-item:last-child{border-bottom:none}
.parte-name{font-size:.85rem;font-weight:600;flex:1}
.parte-price{font-size:.85rem;color:#16a34a;font-weight:700;white-space:nowrap}
.parte-qty{font-size:.78rem;color:#64748b}

/* Mech grid */
.mech-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mech-opt{padding:10px;border:2px solid #e2e8f0;border-radius:10px;text-align:center;font-size:.82rem;font-weight:700;cursor:pointer;color:#64748b;transition:all .15s}
.mech-opt.sel{border-color:#16a34a;background:#f0fdf4;color:#16a34a}

/* Status colors */
.s-przyjeto{background:#dbeafe;color:#1d4ed8}
.s-naprawa{background:#fef9c3;color:#854d0e}
.s-czesci{background:#fed7aa;color:#c2410c}
.s-gotowe{background:#dcfce7;color:#15803d}
.s-wydano{background:#f1f5f9;color:#64748b}

/* Stats */
.stat-card{background:#fff;margin:10px 12px 0;border-radius:14px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.07);display:flex;align-items:center;gap:14px}
.stat-icon{font-size:2rem}
.stat-val{font-size:1.8rem;font-weight:900;color:#16a34a;line-height:1}
.stat-label{font-size:.8rem;color:#64748b;margin-top:2px}
.bar-row{margin-bottom:10px}
.bar-header{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:4px}
.bar-name{font-weight:700}
.bar-count{color:#64748b}
.bar-track{background:#f1f5f9;border-radius:100px;height:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:100px;background:#16a34a;transition:width .6s}

/* Toast */
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:100px;font-size:.85rem;font-weight:600;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="topbar" id="topbar">
  <span class="topbar-back" id="backBtn" onclick="goBack()">&#8592;</span>
  <div class="topbar-info">
    <div class="topbar-title" id="topbarTitle">Agroserwis Serwis</div>
    <div class="topbar-sub" id="topbarSub">System serwisowy</div>
  </div>
</div>

<div class="content" id="content"></div>

<nav class="bottomnav" id="bottomnav">
  <button class="nav-btn active" id="nav-lista" onclick="nav('lista')">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg>
    Zlecenia
  </button>
  <button class="nav-btn" id="nav-nowe" onclick="nav('nowe')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    Nowe
  </button>
  <button class="nav-btn" id="nav-stat" onclick="nav('stat')">
    <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    Statystyki
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
'use strict';

const STATUSY = ['Przyjęto','W naprawie','Czeka na części','Gotowe','Wydano'];
const STATUS_CLS = {'Przyjęto':'s-przyjeto','W naprawie':'s-naprawa','Czeka na części':'s-czesci','Gotowe':'s-gotowe','Wydano':'s-wydano'};

let currentView = 'lista';
let currentId = null;
let mechanicy = [];
let selMechId = null;
let filterStatus = 'Wszystkie';
let searchVal = '';
let navStack = [];

async function api(method, path, body) {
  const opts = { method, headers: {'Content-Type':'application/json'}, cache: 'no-store' };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

function toast(msg, dur = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), dur);
}

function chip(status) {
  return `<span class="card-status ${STATUS_CLS[status]||'s-wydano'}">${status}</span>`;
}

function fmt(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit',year:'numeric'});
}

function setTop(title, sub, back) {
  document.getElementById('topbarTitle').textContent = title;
  document.getElementById('topbarSub').textContent = sub || '';
  document.getElementById('backBtn').style.display = back ? 'block' : 'none';
}

function setNav(view) {
  ['lista','nowe','stat'].forEach(v =>
    document.getElementById('nav-'+v).classList.toggle('active', v === view));
  document.getElementById('bottomnav').style.display =
    ['szczegoly','edytuj','czesci'].includes(view) ? 'none' : 'flex';
}

function nav(view, id) {
  if (!['lista','nowe','stat'].includes(view)) navStack.push(currentView);
  else navStack = [];
  currentView = view;
  currentId = id || null;
  render();
}

function goBack() {
  const prev = navStack.pop() || 'lista';
  if (prev === 'szczegoly' && currentId) {
    currentView = 'szczegoly';
    render();
  } else {
    nav(prev === 'lista' ? 'lista' : prev);
  }
}

function render() {
  setNav(currentView);
  if (currentView === 'lista') renderLista();
  else if (currentView === 'szczegoly') renderSzczegoly(currentId);
  else if (currentView === 'edytuj') renderEdytuj(currentId);
  else if (currentView === 'czesci') renderCzesci(currentId);
  else if (currentView === 'nowe') renderNowe();
  else if (currentView === 'stat') renderStat();
}

// ─── LISTA ────────────────────────────────────────────────────────────────────

async function renderLista() {
  setTop('Zlecenia', 'Lista zleceń', false);
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="search-wrap">
      <div class="search-bar"><input class="search-input" id="si" type="search" placeholder="Szukaj klienta, nr, marki..." value="${searchVal}"></div>
      <div class="filter-scroll" id="fs"></div>
    </div>
    <div id="li"><div class="loading">Ładowanie...</div></div>`;
  document.getElementById('si').addEventListener('input', e => { searchVal = e.target.value; loadLista(); });
  const fs = document.getElementById('fs');
  ['Wszystkie','Przyjęto','W naprawie','Czeka na części','Gotowe','Wydano'].forEach(s => {
    const b = document.createElement('button');
    b.className = 'chip' + (s === filterStatus ? ' active' : '');
    b.textContent = s;
    b.onclick = () => { filterStatus = s; fs.querySelectorAll('.chip').forEach(x => x.classList.remove('active')); b.classList.add('active'); loadLista(); };
    fs.appendChild(b);
  });
  loadLista();
}

async function loadLista() {
  const p = new URLSearchParams();
  if (filterStatus !== 'Wszystkie') p.set('status', filterStatus);
  if (searchVal) p.set('szukaj', searchVal);
  const data = await api('GET', `/api/zlecenia?${p}`);
  const c = document.getElementById('li');
  if (!data.length) { c.innerHTML = `<div class="empty"><div class="empty-icon">📋</div>Brak zleceń</div>`; return; }
  c.innerHTML = data.map(z => {
    const sp = [z.marka, z.model].filter(Boolean).join(' ') || '—';
    return `<div class="card" onclick="nav('szczegoly',${z.id})">
      <div class="card-top"><span class="card-numer">${z.numer}</span>${chip(z.status)}</div>
      <div class="card-klient">${z.klient_nazwa||'—'}</div>
      <div class="card-sprzet">${sp}</div>
      <div class="card-date">${fmt(z.data_przyjecia)}</div>
    </div>`;
  }).join('') + '<div style="height:14px"></div>';
}

// ─── SZCZEGÓŁY ────────────────────────────────────────────────────────────────

async function renderSzczegoly(id) {
  setTop('Zlecenie', '…', true);
  document.getElementById('content').innerHTML = '<div class="loading">Ładowanie...</div>';
  const z = await api('GET', `/api/zlecenia/${id}`);
  if (!z) { document.getElementById('content').innerHTML = '<div class="empty">Nie znaleziono</div>'; return; }
  setTop(z.numer, z.klient_nazwa||'', true);
  const sp = [z.marka, z.model].filter(Boolean).join(' ') || '—';
  const mech = mechanicy.find(m => m.id === z.mechanik_id);
  const czesci = z.czesci || [];
  const kCz = czesci.reduce((s,c) => s + c.ilosc*c.cena_jednostkowa, 0);
  const kTot = kCz + (z.koszt_robocizny||0);

  const parteHtml = czesci.length
    ? czesci.map(p => `<div class="parte-item">
        <div><div class="parte-name">${p.nazwa}</div><div class="parte-qty">×${p.ilosc}</div></div>
        <div class="parte-price">${(p.ilosc*p.cena_jednostkowa).toFixed(2)} zł</div>
      </div>`).join('')
    : '<div style="color:#94a3b8;font-size:.85rem;padding:4px 0">Brak części</div>';

  const statusOpts = STATUSY.map(s => `<option${s===z.status?' selected':''}>${s}</option>`).join('');

  document.getElementById('content').innerHTML = `
    <div class="section">
      <div class="section-title">Klient</div>
      <div class="row"><span class="row-label">Nazwisko</span><span class="row-val">${z.klient_nazwa||'—'}</span></div>
      <div class="row"><span class="row-label">Telefon</span><span class="row-val"><a href="tel:${z.klient_telefon}" style="color:#16a34a">${z.klient_telefon||'—'}</a></span></div>
      <div class="row"><span class="row-label">E-mail</span><span class="row-val" style="font-size:.78rem">${z.klient_email||'—'}</span></div>
    </div>
    <div class="section">
      <div class="section-title">Sprzęt</div>
      <div class="row"><span class="row-label">Marka/Model</span><span class="row-val">${sp}</span></div>
      ${z.nr_seryjny ? `<div class="row"><span class="row-label">Nr ser.</span><span class="row-val">${z.nr_seryjny}</span></div>` : ''}
      <div class="row"><span class="row-label">Usterka</span><span class="row-val" style="font-size:.82rem">${z.opis_usterki||'—'}</span></div>
      ${z.uwagi ? `<div class="row"><span class="row-label">Uwagi</span><span class="row-val" style="font-size:.82rem">${z.uwagi}</span></div>` : ''}
    </div>
    <div class="section">
      <div class="section-title">Status</div>
      <div class="row"><span class="row-label">Mechanik</span><span class="row-val">${mech?mech.nazwa:'—'}</span></div>
      <div class="row"><span class="row-label">Przyjęto</span><span class="row-val">${fmt(z.data_przyjecia)}</span></div>
      <select id="statusSel" style="width:100%;margin-top:10px;padding:10px;border:2px solid #e2e8f0;border-radius:10px;font-size:.9rem;font-weight:700;outline:none">${statusOpts}</select>
      <button class="btn-green" style="margin-top:10px" onclick="saveStatus(${z.id})">Zapisz status</button>
    </div>
    <div class="section">
      <div class="section-title">Części i koszty</div>
      ${parteHtml}
      <div class="row" style="margin-top:8px"><span class="row-label">Robocizna</span><span class="row-val">${(z.koszt_robocizny||0).toFixed(2)} zł</span></div>
      <div class="row"><span class="row-label">Części</span><span class="row-val">${kCz.toFixed(2)} zł</span></div>
      <div class="row"><span class="row-label" style="font-weight:700">Łącznie</span><span class="row-val" style="color:#16a34a;font-size:.95rem">${kTot.toFixed(2)} zł</span></div>
      <button class="btn-outline" onclick="goToCzesci(${z.id})">+ Zarządzaj częściami</button>
    </div>
    <div style="padding:12px">
      <button class="btn-outline" onclick="goToEdytuj(${z.id})">✏ Edytuj dane zlecenia</button>
      <button class="btn-danger" onclick="usunZlecenie(${z.id})">🗑 Usuń zlecenie</button>
    </div>
    <div style="height:16px"></div>`;
}

async function saveStatus(id) {
  const status = document.getElementById('statusSel').value;
  await api('PUT', `/api/zlecenia/${id}`, { status });
  toast('Status zapisany ✓');
  setTimeout(() => renderSzczegoly(id), 500);
}

async function usunZlecenie(id) {
  if (!confirm('Usunąć to zlecenie?')) return;
  await api('DELETE', `/api/zlecenia/${id}`);
  toast('Zlecenie usunięte');
  nav('lista');
}

function goToEdytuj(id) { navStack.push('szczegoly'); currentView = 'edytuj'; currentId = id; render(); }
function goToCzesci(id) { navStack.push('szczegoly'); currentView = 'czesci'; currentId = id; render(); }

// ─── EDYTUJ ───────────────────────────────────────────────────────────────────

async function renderEdytuj(id) {
  setTop('Edytuj zlecenie', '', true);
  document.getElementById('content').innerHTML = '<div class="loading">Ładowanie...</div>';
  const z = await api('GET', `/api/zlecenia/${id}`);
  if (!mechanicy.length) mechanicy = await api('GET', '/api/mechanicy');
  selMechId = z.mechanik_id;

  const mechGrid = mechanicy.map(m =>
    `<div class="mech-opt${m.id===z.mechanik_id?' sel':''}" id="mo-${m.id}" onclick="selMech(${m.id})">${m.nazwa}</div>`
  ).join('');

  const statusOpts = STATUSY.map(s => `<option${s===z.status?' selected':''}>${s}</option>`).join('');

  document.getElementById('content').innerHTML = `
    <div class="section" style="margin-top:12px">
      <div class="section-title">Klient</div>
      <div class="field"><label>Imię i nazwisko</label><input id="e-nazwa" value="${z.klient_nazwa||''}"></div>
      <div class="field"><label>Telefon</label><input id="e-tel" type="tel" value="${z.klient_telefon||''}"></div>
      <div class="field"><label>E-mail</label><input id="e-email" type="email" value="${z.klient_email||''}"></div>
    </div>
    <div class="section">
      <div class="section-title">Sprzęt</div>
      <div class="field"><label>Marka</label><input id="e-marka" value="${z.marka||''}"></div>
      <div class="field"><label>Model</label><input id="e-model" value="${z.model||''}"></div>
      <div class="field"><label>Nr seryjny</label><input id="e-ser" value="${z.nr_seryjny||''}"></div>
      <div class="field"><label>Usterka</label><textarea id="e-usterka">${z.opis_usterki||''}</textarea></div>
      <div class="field"><label>Uwagi</label><textarea id="e-uwagi">${z.uwagi||''}</textarea></div>
    </div>
    <div class="section">
      <div class="section-title">Status i koszty</div>
      <div class="field"><label>Status</label><select id="e-status">${statusOpts}</select></div>
      <div class="field"><label>Koszt robocizny (zł)</label><input id="e-rob" type="number" step="0.01" value="${z.koszt_robocizny||0}"></div>
    </div>
    ${mechanicy.length ? `<div class="section"><div class="section-title">Mechanik</div><div class="mech-grid">${mechGrid}</div></div>` : ''}
    <div style="padding:12px">
      <button class="btn-green" onclick="zapiszEdycje(${id})">Zapisz zmiany</button>
    </div>
    <div style="height:16px"></div>`;
}

function selMech(id) {
  selMechId = id;
  document.querySelectorAll('.mech-opt').forEach(el => el.classList.remove('sel'));
  const el = document.getElementById('mo-'+id);
  if (el) el.classList.add('sel');
}

async function zapiszEdycje(id) {
  await api('PUT', `/api/zlecenia/${id}`, {
    klient_nazwa:   document.getElementById('e-nazwa').value.trim(),
    klient_telefon: document.getElementById('e-tel').value.trim(),
    klient_email:   document.getElementById('e-email').value.trim(),
    marka:          document.getElementById('e-marka').value.trim(),
    model:          document.getElementById('e-model').value.trim(),
    nr_seryjny:     document.getElementById('e-ser').value.trim(),
    opis_usterki:   document.getElementById('e-usterka').value.trim(),
    uwagi:          document.getElementById('e-uwagi').value.trim(),
    status:         document.getElementById('e-status').value,
    koszt_robocizny: parseFloat(document.getElementById('e-rob').value)||0,
    mechanik_id:    selMechId,
  });
  toast('Zapisano ✓');
  navStack = [];
  currentView = 'szczegoly';
  render();
}

// ─── CZĘŚCI ───────────────────────────────────────────────────────────────────

async function renderCzesci(id) {
  setTop('Części', '', true);
  document.getElementById('content').innerHTML = '<div class="loading">Ładowanie...</div>';
  const z = await api('GET', `/api/zlecenia/${id}`);
  const czesci = z.czesci || [];

  const liHtml = czesci.length
    ? czesci.map(p => `<div class="parte-item">
        <div style="flex:1"><div class="parte-name">${p.nazwa}</div>
        <div class="parte-qty">×${p.ilosc} · ${p.cena_jednostkowa.toFixed(2)} zł/szt</div></div>
        <div class="parte-price">${(p.ilosc*p.cena_jednostkowa).toFixed(2)} zł</div>
        <button class="btn-sm btn-sm-red" style="margin-left:10px" onclick="usunCzesc(${p.id},${id})">✕</button>
      </div>`).join('')
    : '<div style="color:#94a3b8;font-size:.85rem;padding:4px 0">Brak części</div>';

  document.getElementById('content').innerHTML = `
    <div class="section" style="margin-top:12px">
      <div class="section-title">Lista części</div>
      <div id="parteList">${liHtml}</div>
    </div>
    <div class="section">
      <div class="section-title">Dodaj część</div>
      <div class="field"><label>Nazwa części</label><input id="p-nazwa" placeholder="np. Łańcuch piły"></div>
      <div style="display:flex;gap:10px">
        <div class="field" style="flex:1"><label>Ilość</label><input id="p-ilosc" type="number" value="1" min="1"></div>
        <div class="field" style="flex:1"><label>Cena (zł)</label><input id="p-cena" type="number" step="0.01" value="0" min="0"></div>
      </div>
      <button class="btn-green" onclick="dodajCzesc(${id})">+ Dodaj</button>
    </div>
    <div style="height:16px"></div>`;
}

async function dodajCzesc(zlecenieId) {
  const nazwa = document.getElementById('p-nazwa').value.trim();
  if (!nazwa) { toast('Wpisz nazwę części'); return; }
  const ilosc = parseFloat(document.getElementById('p-ilosc').value) || 1;
  const cena  = parseFloat(document.getElementById('p-cena').value)  || 0;
  await api('POST', '/api/czesci', { zlecenie_id: zlecenieId, nazwa, ilosc, cena_jednostkowa: cena });
  toast('Część dodana ✓');
  renderCzesci(zlecenieId);
}

async function usunCzesc(partId, zlecenieId) {
  await api('DELETE', `/api/czesci/${partId}`);
  toast('Usunięto');
  renderCzesci(zlecenieId);
}

// ─── NOWE ─────────────────────────────────────────────────────────────────────

async function renderNowe() {
  setTop('Nowe zlecenie', '', false);
  if (!mechanicy.length) mechanicy = await api('GET', '/api/mechanicy');
  selMechId = null;

  const mechGrid = mechanicy.map(m =>
    `<div class="mech-opt" id="mn-${m.id}" onclick="selMechN(${m.id})">${m.nazwa}</div>`
  ).join('');

  document.getElementById('content').innerHTML = `
    <div class="section" style="margin-top:12px">
      <div class="section-title">Klient</div>
      <div class="field"><label>Imię i nazwisko *</label><input id="n-nazwa" placeholder="Jan Kowalski"></div>
      <div class="field"><label>Telefon</label><input id="n-tel" type="tel" placeholder="500 000 000"></div>
      <div class="field"><label>E-mail</label><input id="n-email" type="email" placeholder="jan@email.com"></div>
    </div>
    <div class="section">
      <div class="section-title">Sprzęt</div>
      <div class="field"><label>Marka</label><input id="n-marka" placeholder="np. Stihl"></div>
      <div class="field"><label>Model</label><input id="n-model" placeholder="np. MS 250"></div>
      <div class="field"><label>Usterka *</label><textarea id="n-usterka" placeholder="Opisz problem..."></textarea></div>
    </div>
    ${mechanicy.length ? `<div class="section"><div class="section-title">Mechanik</div><div class="mech-grid">${mechGrid}</div></div>` : ''}
    <div style="padding:12px">
      <button class="btn-green" onclick="submitNowe()">+ Utwórz zlecenie</button>
    </div>
    <div style="height:16px"></div>`;
}

function selMechN(id) {
  selMechId = id;
  document.querySelectorAll('.mech-opt').forEach(el => el.classList.remove('sel'));
  const el = document.getElementById('mn-'+id);
  if (el) el.classList.add('sel');
}

async function submitNowe() {
  const nazwa   = document.getElementById('n-nazwa')?.value?.trim();
  const usterka = document.getElementById('n-usterka')?.value?.trim();
  if (!nazwa)   { toast('Podaj imię i nazwisko'); return; }
  if (!usterka) { toast('Opisz usterkę'); return; }
  const btn = document.querySelector('.btn-green');
  btn.textContent = 'Tworzenie...'; btn.disabled = true;
  const res = await api('POST', '/api/zlecenia', {
    klient_nazwa:    nazwa,
    klient_telefon:  document.getElementById('n-tel')?.value?.trim()||'',
    klient_email:    document.getElementById('n-email')?.value?.trim()||'',
    marka:           document.getElementById('n-marka')?.value?.trim()||'',
    model:           document.getElementById('n-model')?.value?.trim()||'',
    opis_usterki:    usterka,
    mechanik_id:     selMechId,
  });
  if (res?.id) { toast(`Zlecenie ${res.numer} utworzone ✓`); setTimeout(() => nav('szczegoly', res.id), 600); }
  else { btn.textContent = '+ Utwórz zlecenie'; btn.disabled = false; toast('Błąd — spróbuj ponownie'); }
}

// ─── STATYSTYKI ───────────────────────────────────────────────────────────────

async function renderStat() {
  setTop('Statystyki', '', false);
  document.getElementById('content').innerHTML = '<div class="loading">Ładowanie...</div>';
  const s = await api('GET', '/api/statystyki');
  const max = Math.max(1, ...Object.values(s.statusy||{}));
  const bars = Object.entries(s.statusy||{}).map(([st,cnt]) => `
    <div class="bar-row">
      <div class="bar-header"><span class="bar-name">${st}</span><span class="bar-count">${cnt}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(cnt/max*100).toFixed(0)}%"></div></div>
    </div>`).join('');
  document.getElementById('content').innerHTML = `
    <div class="stat-card"><div class="stat-icon">📋</div><div><div class="stat-val">${s.total||0}</div><div class="stat-label">Wszystkich zleceń</div></div></div>
    <div class="stat-card"><div class="stat-icon">📅</div><div><div class="stat-val">${s.dzisiaj||0}</div><div class="stat-label">Dzisiaj przyjętych</div></div></div>
    <div class="section" style="margin-top:10px"><div class="section-title">Podział statusów</div>${bars||'<div style="color:#94a3b8;font-size:.85rem">Brak danych</div>'}</div>
    <div style="height:16px"></div>`;
}

// ─── INIT ─────────────────────────────────────────────────────────────────────

(async () => {
  mechanicy = await api('GET', '/api/mechanicy').catch(() => []);
  render();
})();
</script>
</body>
</html>
