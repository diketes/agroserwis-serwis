<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Agroserwis Serwis</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f1f5f9;color:#1e293b;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.topbar-back{font-size:1.3rem;cursor:pointer;padding:4px 8px 4px 0;display:none}
.topbar-title{font-size:1.05rem;font-weight:800;flex:1}
.topbar-sub{font-size:.7rem;opacity:.75}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.bottomnav{background:#fff;border-top:1px solid #e2e8f0;display:flex;flex-shrink:0}
.nav-btn{flex:1;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:#94a3b8;font-size:.65rem;font-weight:600;border:none;background:none;transition:color .15s}
.nav-btn.active{color:#16a34a}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Lista */
.search-bar{padding:12px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;gap:8px}
.search-input{flex:1;border:1.5px solid #e2e8f0;border-radius:10px;padding:8px 12px;font-size:.9rem;outline:none;background:#f8fafc}
.search-input:focus{border-color:#16a34a}
.filter-scroll{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;background:#fff;border-bottom:1px solid #e2e8f0;flex-shrink:0}
.filter-scroll::-webkit-scrollbar{display:none}
.chip{padding:5px 14px;border-radius:100px;font-size:.78rem;font-weight:700;border:2px solid #e2e8f0;background:#fff;cursor:pointer;white-space:nowrap;color:#64748b;transition:all .15s}
.chip.active{background:#16a34a;border-color:#16a34a;color:#fff}
.card{background:#fff;margin:10px 12px 0;border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);cursor:pointer;transition:transform .1s}
.card:active{transform:scale(.98)}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.card-numer{font-family:monospace;font-size:.85rem;font-weight:900;color:#16a34a}
.card-status{font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:100px}
.card-klient{font-size:.95rem;font-weight:700;color:#1e293b}
.card-sprzet{font-size:.8rem;color:#64748b;margin-top:2px}
.card-date{font-size:.72rem;color:#94a3b8;margin-top:6px}
.empty{text-align:center;padding:60px 24px;color:#94a3b8}
.empty-icon{font-size:3rem;margin-bottom:12px}
.loading{text-align:center;padding:40px;color:#94a3b8}

/* Szczegóły */
.detail-section{background:#fff;margin:12px;border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.detail-section-title{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8;margin-bottom:12px}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #f1f5f9}
.detail-row:last-child{border-bottom:none}
.detail-label{font-size:.82rem;color:#64748b}
.detail-val{font-size:.88rem;font-weight:700;color:#1e293b;text-align:right;max-width:60%}
.status-select{width:100%;padding:10px;border:2px solid #e2e8f0;border-radius:10px;font-size:.9rem;font-weight:700;color:#1e293b;background:#f8fafc;outline:none;margin-top:8px}
.status-select:focus{border-color:#16a34a}
.btn-save{width:100%;padding:14px;background:#16a34a;color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:12px}
.btn-save:active{background:#15803d}
.btn-danger{width:100%;padding:12px;background:#fff;color:#ef4444;border:2px solid #fecaca;border-radius:12px;font-size:.9rem;font-weight:700;cursor:pointer;margin-top:8px}
.parte-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:.85rem}
.parte-item:last-child{border-bottom:none}
.parte-total{font-weight:900;color:#16a34a}

/* Nowe zlecenie */
.form-group{margin-bottom:14px}
.form-label{font-size:.75rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;display:block}
.form-input{width:100%;padding:11px 13px;border:2px solid #e2e8f0;border-radius:10px;font-size:.95rem;color:#1e293b;background:#fff;outline:none;transition:border-color .15s}
.form-input:focus{border-color:#16a34a}
.form-section{background:#fff;margin:12px;border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.form-section-title{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8;margin-bottom:14px}
.mech-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mech-option{padding:10px;border:2px solid #e2e8f0;border-radius:10px;text-align:center;font-size:.82rem;font-weight:700;cursor:pointer;transition:all .15s;color:#64748b}
.mech-option.selected{border-color:#16a34a;background:#f0fdf4;color:#16a34a}

/* Statystyki */
.stat-card{background:#fff;margin:12px 12px 0;border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.07);display:flex;align-items:center;gap:14px}
.stat-icon{font-size:2rem}
.stat-val{font-size:1.8rem;font-weight:900;color:#16a34a;line-height:1}
.stat-label{font-size:.8rem;color:#64748b;margin-top:2px}
.status-bars{background:#fff;margin:12px;border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.bar-row{margin-bottom:10px}
.bar-label{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:4px}
.bar-label-name{font-weight:700}
.bar-label-count{color:#64748b}
.bar-track{background:#f1f5f9;border-radius:100px;height:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:100px;background:#16a34a;transition:width .6s}

/* Toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:100px;font-size:.85rem;font-weight:600;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* Status colors */
.s-przyjeto{background:#dbeafe;color:#1d4ed8}
.s-naprawa{background:#fef9c3;color:#854d0e}
.s-czesci{background:#fed7aa;color:#c2410c}
.s-gotowe{background:#dcfce7;color:#15803d}
.s-wydano{background:#f1f5f9;color:#64748b}
</style>
</head>
<body>

<div class="topbar" id="topbar">
  <span class="topbar-back" id="backBtn" onclick="goBack()">&#8592;</span>
  <div>
    <div class="topbar-title" id="topbarTitle">Agroserwis Serwis</div>
    <div class="topbar-sub" id="topbarSub">System serwisowy</div>
  </div>
</div>

<div class="content" id="mainContent"></div>

<nav class="bottomnav" id="bottomnav">
  <button class="nav-btn active" id="nav-lista" onclick="showView('lista')">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg>
    Zlecenia
  </button>
  <button class="nav-btn" id="nav-nowe" onclick="showView('nowe')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    Nowe
  </button>
  <button class="nav-btn" id="nav-statystyki" onclick="showView('statystyki')">
    <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    Statystyki
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
'use strict';

let currentView = 'lista';
let currentZlecenieId = null;
let mechanicy = [];
let selectedMechanikId = null;
let filterStatus = 'Wszystkie';
let searchVal = '';

const STATUSY = ['Przyjęto','W naprawie','Czeka na części','Gotowe','Wydano'];
const STATUS_CLS = {'Przyjęto':'s-przyjeto','W naprawie':'s-naprawa','Czeka na części':'s-czesci','Gotowe':'s-gotowe','Wydano':'s-wydano'};

async function api(method, path, body) {
  const opts = { method, headers: {'Content-Type':'application/json'}, cache: 'no-store' };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  return r.json();
}

function toast(msg, dur = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}

function statusChip(status) {
  const cls = STATUS_CLS[status] || 's-wydano';
  return `<span class="card-status ${cls}">${status}</span>`;
}

function dateStr(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('pl-PL', {day:'2-digit',month:'2-digit',year:'numeric'});
}

function setTopbar(title, sub, showBack) {
  document.getElementById('topbarTitle').textContent = title;
  document.getElementById('topbarSub').textContent = sub;
  document.getElementById('backBtn').style.display = showBack ? 'block' : 'none';
}

function setActiveNav(view) {
  ['lista','nowe','statystyki'].forEach(v => {
    document.getElementById('nav-'+v).classList.toggle('active', v === view);
  });
  document.getElementById('bottomnav').style.display = view === 'szczegoly' ? 'none' : 'flex';
}

function goBack() {
  showView('lista');
}

function showView(view, id) {
  currentView = view;
  if (view === 'lista') {
    setTopbar('Zlecenia', 'Lista zleceń', false);
    setActiveNav('lista');
    renderLista();
  } else if (view === 'szczegoly') {
    currentZlecenieId = id;
    setTopbar('Szczegóły zlecenia', '', true);
    setActiveNav('szczegoly');
    renderSzczegoly(id);
  } else if (view === 'nowe') {
    setTopbar('Nowe zlecenie', '', false);
    setActiveNav('nowe');
    renderNowe();
  } else if (view === 'statystyki') {
    setTopbar('Statystyki', '', false);
    setActiveNav('statystyki');
    renderStatystyki();
  }
}

// ─── LISTA ───────────────────────────────────────────────────────────────────

async function renderLista() {
  const c = document.getElementById('mainContent');
  c.innerHTML = `
    <div class="search-bar" style="position:sticky;top:0;z-index:10">
      <input class="search-input" id="searchInput" type="search" placeholder="Szukaj klienta, nr, marki..." value="${searchVal}">
    </div>
    <div class="filter-scroll" id="filterScroll"></div>
    <div id="listaItems"><div class="loading">Ładowanie...</div></div>`;

  document.getElementById('searchInput').addEventListener('input', e => {
    searchVal = e.target.value;
    loadZlecenia();
  });

  const fs = document.getElementById('filterScroll');
  ['Wszystkie','Przyjęto','W naprawie','Czeka na części','Gotowe','Wydano'].forEach(s => {
    const ch = document.createElement('button');
    ch.className = 'chip' + (s === filterStatus ? ' active' : '');
    ch.textContent = s;
    ch.onclick = () => {
      filterStatus = s;
      document.querySelectorAll('.chip').forEach(el => el.classList.remove('active'));
      ch.classList.add('active');
      loadZlecenia();
    };
    fs.appendChild(ch);
  });

  loadZlecenia();
}

async function loadZlecenia() {
  const params = new URLSearchParams();
  if (filterStatus !== 'Wszystkie') params.set('status', filterStatus);
  if (searchVal) params.set('szukaj', searchVal);
  const data = await api('GET', `/api/zlecenia?${params}`);
  const c = document.getElementById('listaItems');
  if (!data || !data.length) {
    c.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><div>Brak zleceń</div></div>`;
    return;
  }
  c.innerHTML = data.map(z => {
    const sprzet = [z.marka, z.model].filter(Boolean).join(' ') || '—';
    return `<div class="card" onclick="showView('szczegoly',${z.id})">
      <div class="card-top">
        <span class="card-numer">${z.numer}</span>
        ${statusChip(z.status)}
      </div>
      <div class="card-klient">${z.klient_nazwa || '—'}</div>
      <div class="card-sprzet">${sprzet}</div>
      <div class="card-date">${dateStr(z.data_przyjecia)}</div>
    </div>`;
  }).join('') + '<div style="height:16px"></div>';
}

// ─── SZCZEGÓŁY ───────────────────────────────────────────────────────────────

async function renderSzczegoly(id) {
  const c = document.getElementById('mainContent');
  c.innerHTML = '<div class="loading">Ładowanie...</div>';
  const z = await api('GET', `/api/zlecenia/${id}`);
  if (!z) { c.innerHTML = '<div class="empty">Nie znaleziono</div>'; return; }

  setTopbar(z.numer, z.klient_nazwa || '', true);

  const sprzet = [z.marka, z.model].filter(Boolean).join(' ') || '—';
  const koszCzesci = (z.czesci || []).reduce((s, c) => s + c.ilosc * c.cena_jednostkowa, 0);
  const koszTotal = koszCzesci + (z.koszt_robocizny || 0);

  const parteHtml = (z.czesci || []).length
    ? (z.czesci || []).map(p => `<div class="parte-item"><span>${p.nazwa} ×${p.ilosc}</span><span>${(p.ilosc*p.cena_jednostkowa).toFixed(2)} zł</span></div>`).join('')
    : '<div style="color:#94a3b8;font-size:.85rem">Brak części</div>';

  const mechNazwa = mechanicy.find(m => m.id === z.mechanik_id)?.nazwa || '—';

  const statusOptions = STATUSY.map(s =>
    `<option value="${s}" ${s === z.status ? 'selected' : ''}>${s}</option>`
  ).join('');

  c.innerHTML = `
    <div class="detail-section">
      <div class="detail-section-title">Klient</div>
      <div class="detail-row"><span class="detail-label">Imię i nazwisko</span><span class="detail-val">${z.klient_nazwa || '—'}</span></div>
      <div class="detail-row"><span class="detail-label">Telefon</span><span class="detail-val"><a href="tel:${z.klient_telefon}" style="color:#16a34a">${z.klient_telefon || '—'}</a></span></div>
      <div class="detail-row"><span class="detail-label">E-mail</span><span class="detail-val" style="font-size:.78rem">${z.klient_email || '—'}</span></div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">Sprzęt</div>
      <div class="detail-row"><span class="detail-label">Marka / model</span><span class="detail-val">${sprzet}</span></div>
      ${z.nr_seryjny ? `<div class="detail-row"><span class="detail-label">Nr seryjny</span><span class="detail-val">${z.nr_seryjny}</span></div>` : ''}
      <div class="detail-row"><span class="detail-label">Usterka</span><span class="detail-val" style="font-size:.82rem">${z.opis_usterki || '—'}</span></div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">Status i mechanik</div>
      <div class="detail-row"><span class="detail-label">Mechanik</span><span class="detail-val">${mechNazwa}</span></div>
      <div class="detail-row"><span class="detail-label">Przyjęto</span><span class="detail-val">${dateStr(z.data_przyjecia)}</span></div>
      <select class="status-select" id="statusSelect">${statusOptions}</select>
      <button class="btn-save" onclick="saveStatus(${z.id})">Zapisz status</button>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">Części i koszty</div>
      ${parteHtml}
      <div class="detail-row" style="margin-top:8px"><span class="detail-label">Robocizna</span><span class="detail-val">${(z.koszt_robocizny||0).toFixed(2)} zł</span></div>
      <div class="detail-row"><span class="detail-label">Części</span><span class="detail-val">${koszCzesci.toFixed(2)} zł</span></div>
      <div class="detail-row"><span class="detail-label">Łącznie</span><span class="detail-val parte-total">${koszTotal.toFixed(2)} zł</span></div>
    </div>
    <div style="height:16px"></div>`;
}

async function saveStatus(id) {
  const status = document.getElementById('statusSelect').value;
  await api('PUT', `/api/zlecenia/${id}`, { status });
  toast('Status zapisany ✓');
  setTimeout(() => showView('szczegoly', id), 600);
}

// ─── NOWE ────────────────────────────────────────────────────────────────────

async function renderNowe() {
  if (!mechanicy.length) {
    mechanicy = await api('GET', '/api/mechanicy');
  }
  selectedMechanikId = null;

  const mechGrid = mechanicy.map(m =>
    `<div class="mech-option" id="mopt-${m.id}" onclick="selectMech(${m.id})">${m.nazwa}</div>`
  ).join('');

  document.getElementById('mainContent').innerHTML = `
    <div class="form-section">
      <div class="form-section-title">Klient</div>
      <div class="form-group"><label class="form-label">Imię i nazwisko *</label>
        <input class="form-input" id="f-nazwa" type="text" placeholder="Jan Kowalski"></div>
      <div class="form-group"><label class="form-label">Telefon</label>
        <input class="form-input" id="f-tel" type="tel" placeholder="500 000 000"></div>
      <div class="form-group"><label class="form-label">E-mail</label>
        <input class="form-input" id="f-email" type="email" placeholder="jan@email.com"></div>
    </div>
    <div class="form-section">
      <div class="form-section-title">Sprzęt</div>
      <div class="form-group"><label class="form-label">Marka</label>
        <input class="form-input" id="f-marka" type="text" placeholder="np. Stihl"></div>
      <div class="form-group"><label class="form-label">Model</label>
        <input class="form-input" id="f-model" type="text" placeholder="np. MS 250"></div>
      <div class="form-group"><label class="form-label">Opis usterki *</label>
        <textarea class="form-input" id="f-usterka" rows="3" placeholder="Opisz problem..."></textarea></div>
    </div>
    ${mechanicy.length ? `<div class="form-section">
      <div class="form-section-title">Mechanik</div>
      <div class="mech-grid">${mechGrid}</div>
    </div>` : ''}
    <div style="padding:12px">
      <button class="btn-save" onclick="submitNowe()">+ Utwórz zlecenie</button>
    </div>
    <div style="height:16px"></div>`;
}

function selectMech(id) {
  selectedMechanikId = id;
  document.querySelectorAll('.mech-option').forEach(el => el.classList.remove('selected'));
  const el = document.getElementById('mopt-'+id);
  if (el) el.classList.add('selected');
}

async function submitNowe() {
  const nazwa = document.getElementById('f-nazwa')?.value?.trim();
  const usterka = document.getElementById('f-usterka')?.value?.trim();
  if (!nazwa) { toast('Podaj imię i nazwisko klienta'); return; }
  if (!usterka) { toast('Opisz usterkę'); return; }

  const btn = document.querySelector('.btn-save');
  btn.textContent = 'Tworzenie...';
  btn.disabled = true;

  const res = await api('POST', '/api/zlecenia', {
    klient_nazwa: nazwa,
    klient_telefon: document.getElementById('f-tel')?.value?.trim() || '',
    klient_email: document.getElementById('f-email')?.value?.trim() || '',
    marka: document.getElementById('f-marka')?.value?.trim() || '',
    model: document.getElementById('f-model')?.value?.trim() || '',
    opis_usterki: usterka,
    mechanik_id: selectedMechanikId,
  });

  if (res?.id) {
    toast(`Zlecenie ${res.numer} utworzone ✓`);
    setTimeout(() => showView('szczegoly', res.id), 800);
  } else {
    btn.textContent = '+ Utwórz zlecenie';
    btn.disabled = false;
    toast('Błąd — spróbuj ponownie');
  }
}

// ─── STATYSTYKI ──────────────────────────────────────────────────────────────

async function renderStatystyki() {
  const c = document.getElementById('mainContent');
  c.innerHTML = '<div class="loading">Ładowanie...</div>';
  const s = await api('GET', '/api/statystyki');
  if (!s) { c.innerHTML = '<div class="empty">Błąd ładowania</div>'; return; }

  const total = s.total || 0;
  const maxBar = Math.max(1, ...Object.values(s.statusy || {}));

  const bars = Object.entries(s.statusy || {}).map(([status, count]) => `
    <div class="bar-row">
      <div class="bar-label">
        <span class="bar-label-name">${status}</span>
        <span class="bar-label-count">${count}</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${(count/maxBar*100).toFixed(0)}%"></div></div>
    </div>`).join('');

  c.innerHTML = `
    <div class="stat-card">
      <div class="stat-icon">📋</div>
      <div><div class="stat-val">${total}</div><div class="stat-label">Wszystkich zleceń</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">📅</div>
      <div><div class="stat-val">${s.dzisiaj || 0}</div><div class="stat-label">Dzisiaj przyjętych</div></div>
    </div>
    <div class="status-bars" style="margin-top:12px">
      <div class="detail-section-title" style="margin-bottom:14px">Podział statusów</div>
      ${bars || '<div style="color:#94a3b8;font-size:.85rem">Brak danych</div>'}
    </div>
    <div style="height:16px"></div>`;
}

// ─── INIT ─────────────────────────────────────────────────────────────────────

(async () => {
  mechanicy = await api('GET', '/api/mechanicy');
  showView('lista');
})();
</script>
</body>
</html>
