<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Agroserwis Serwis</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f1f5f9;color:#1e293b;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.topbar-back{font-size:1.4rem;cursor:pointer;padding:2px 10px 2px 0;display:none;line-height:1;flex-shrink:0}
.topbar-info{flex:1;min-width:0}
.topbar-title{font-size:1.05rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-sub{font-size:.7rem;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.bottomnav{background:#fff;border-top:1px solid #e2e8f0;display:flex;flex-shrink:0}
.nav-btn{flex:1;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:#94a3b8;font-size:.6rem;font-weight:600;border:none;background:none;transition:color .15s}
.nav-btn.active{color:#16a34a}
.nav-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.section{background:#fff;margin:10px 12px 0;border-radius:14px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.section-title{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #f1f5f9}
.row:last-child{border-bottom:none}
.row-label{font-size:.82rem;color:#64748b;flex-shrink:0}
.row-val{font-size:.88rem;font-weight:700;text-align:right;padding-left:8px;word-break:break-word;min-width:0}

.field{margin-bottom:12px}
.field label{font-size:.72rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;padding:10px 12px;border:2px solid #e2e8f0;border-radius:10px;font-size:.93rem;color:#1e293b;background:#fff;outline:none;transition:border-color .15s;font-family:inherit}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#16a34a}
.field textarea{resize:vertical;min-height:70px}

.btn-green{width:100%;padding:13px;background:#16a34a;color:#fff;border:none;border-radius:11px;font-size:.95rem;font-weight:800;cursor:pointer}
.btn-green:active{background:#15803d}
.btn-green:disabled{background:#86efac;cursor:not-allowed}
.btn-outline{width:100%;padding:11px;background:#fff;color:#16a34a;border:2px solid #16a34a;border-radius:11px;font-size:.9rem;font-weight:700;cursor:pointer;margin-top:8px}
.btn-danger{width:100%;padding:11px;background:#fff;color:#ef4444;border:2px solid #fecaca;border-radius:11px;font-size:.88rem;font-weight:700;cursor:pointer;margin-top:8px}
.btn-gray{width:100%;padding:11px;background:#f1f5f9;color:#64748b;border:none;border-radius:11px;font-size:.88rem;font-weight:700;cursor:pointer;margin-top:8px}
.btn-sm{padding:7px 14px;border-radius:8px;font-size:.78rem;font-weight:700;cursor:pointer;border:none;white-space:nowrap}
.btn-sm-green{background:#16a34a;color:#fff}
.btn-sm-red{background:#fff;color:#ef4444;border:1.5px solid #fecaca}

.search-wrap{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e2e8f0}
.search-bar{padding:10px 12px;display:flex;gap:8px}
.search-input{flex:1;border:1.5px solid #e2e8f0;border-radius:10px;padding:8px 12px;font-size:.9rem;outline:none;background:#f8fafc}
.search-input:focus{border-color:#16a34a}
.filter-scroll{display:flex;gap:8px;padding:4px 12px 10px;overflow-x:auto}
.filter-scroll::-webkit-scrollbar{display:none}
.chip{padding:5px 14px;border-radius:100px;font-size:.78rem;font-weight:700;border:2px solid #e2e8f0;background:#fff;cursor:pointer;white-space:nowrap;color:#64748b}
.chip.active{background:#16a34a;border-color:#16a34a;color:#fff}

.card{background:#fff;margin:10px 12px 0;border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);cursor:pointer;transition:transform .1s}
.card:active{transform:scale(.98)}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.card-numer{font-family:monospace;font-size:.85rem;font-weight:900;color:#16a34a}
.s-badge{font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:100px}
.card-klient{font-size:.95rem;font-weight:700}
.card-sprzet{font-size:.8rem;color:#64748b;margin-top:2px}
.card-date{font-size:.72rem;color:#94a3b8;margin-top:5px}

.parte-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9;gap:8px}
.parte-item:last-child{border-bottom:none}
.parte-name{font-size:.85rem;font-weight:600;flex:1}
.parte-price{font-size:.85rem;color:#16a34a;font-weight:700;white-space:nowrap}
.parte-qty{font-size:.76rem;color:#64748b}

.mech-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.mech-opt{padding:10px;border:2px solid #e2e8f0;border-radius:10px;text-align:center;font-size:.82rem;font-weight:700;cursor:pointer;color:#64748b}
.mech-opt.sel{border-color:#16a34a;background:#f0fdf4;color:#16a34a}

.mech-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9}
.mech-item:last-child{border-bottom:none}
.mech-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;flex-shrink:0}

.stat-card{background:#fff;margin:10px 12px 0;border-radius:14px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.07);display:flex;align-items:center;gap:14px}
.stat-val{font-size:1.8rem;font-weight:900;color:#16a34a;line-height:1}
.stat-label{font-size:.8rem;color:#64748b;margin-top:2px}
.bar-row{margin-bottom:10px}
.bar-header{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:4px}
.bar-name{font-weight:700}
.bar-cnt{color:#64748b}
.bar-track{background:#f1f5f9;border-radius:100px;height:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:100px;background:#16a34a;transition:width .6s}

.settings-item{display:flex;align-items:center;padding:13px 0;border-bottom:1px solid #f1f5f9;cursor:pointer}
.settings-item:last-child{border-bottom:none}
.settings-item-icon{font-size:1.3rem;width:36px;flex-shrink:0}
.settings-item-info{flex:1}
.settings-item-title{font-size:.92rem;font-weight:700}
.settings-item-sub{font-size:.75rem;color:#64748b;margin-top:1px}
.settings-item-arrow{color:#cbd5e1;font-size:1.1rem}

.empty{text-align:center;padding:60px 24px;color:#94a3b8}
.empty-icon{font-size:3rem;margin-bottom:12px}
.loading{text-align:center;padding:40px;color:#94a3b8;font-size:.9rem}

.photo-tabs{display:flex;gap:0;margin-bottom:12px;border-radius:10px;overflow:hidden;border:2px solid #e2e8f0}
.photo-tab{flex:1;padding:8px;text-align:center;font-size:.82rem;font-weight:700;cursor:pointer;background:#f8fafc;color:#64748b;border:none;transition:all .15s}
.photo-tab.active{background:#16a34a;color:#fff}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photo-thumb{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1;background:#f1f5f9;cursor:pointer}
.photo-thumb img{width:100%;height:100%;object-fit:cover}
.photo-del{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:.7rem;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.photo-add{border:2px dashed #cbd5e1;border-radius:8px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:#94a3b8;font-size:.72rem;gap:4px;background:#fafafa;position:relative}
.photo-add input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;z-index:5;-webkit-appearance:none}
.photo-add-icon{font-size:1.5rem}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:flex;align-items:center;justify-content:center}
.lightbox img{max-width:95vw;max-height:90vh;border-radius:10px;object-fit:contain}
.lightbox-close{position:absolute;top:16px;right:16px;color:#fff;font-size:2rem;cursor:pointer;line-height:1}

.s-przyjeto{background:#dbeafe;color:#1d4ed8}
.s-naprawa{background:#fef9c3;color:#854d0e}
.s-czesci{background:#fed7aa;color:#c2410c}
.s-gotowe{background:#dcfce7;color:#15803d}
.s-wydano{background:#f1f5f9;color:#64748b}

.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:100px;font-size:.85rem;font-weight:600;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-back" id="backBtn" onclick="goBack()">&#8592;</span>
  <div class="topbar-info">
    <div class="topbar-title" id="topbarTitle">Agroserwis Serwis</div>
    <div class="topbar-sub" id="topbarSub">System serwisowy</div>
  </div>
</div>

<div class="content" id="content"></div>

<nav class="bottomnav" id="bottomnav">
  <button class="nav-btn active" id="nav-lista" onclick="nav('lista')">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg>
    Zlecenia
  </button>
  <button class="nav-btn" id="nav-nowe" onclick="nav('nowe')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    Nowe
  </button>
  <button class="nav-btn" id="nav-stat" onclick="nav('stat')">
    <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    Statystyki
  </button>
  <button class="nav-btn" id="nav-ustawienia" onclick="nav('ustawienia')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    Ustawienia
  </button>
</nav>

<div class="toast" id="toast"></div>

<!-- MODAL: Zamów część -->
<div id="modalZamow" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;align-items:flex-end;justify-content:center" onclick="if(event.target===this)zamknijZamow()">
  <div style="background:white;border-radius:20px 20px 0 0;padding:20px 20px 32px;width:100%;max-width:480px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:1rem;font-weight:900;color:#1e293b">📦 Zamów brakującą część</div>
      <button onclick="zamknijZamow()" style="background:none;border:none;font-size:1.4rem;cursor:pointer;color:#94a3b8">×</button>
    </div>
    <div style="margin-bottom:12px">
      <label style="font-size:.78rem;font-weight:700;color:#64748b;display:block;margin-bottom:4px">Nazwa części *</label>
      <input id="zc-nazwa" type="text" placeholder="np. Filtr oleju, uszczelka głowicy..." style="width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;font-size:.95rem;outline:none">
    </div>
    <div style="margin-bottom:12px">
      <label style="font-size:.78rem;font-weight:700;color:#64748b;display:block;margin-bottom:4px">Ilość</label>
      <input id="zc-ilosc" type="number" min="1" value="1" style="width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;font-size:.95rem;outline:none">
    </div>
    <div style="margin-bottom:20px">
      <label style="font-size:.78rem;font-weight:700;color:#64748b;display:block;margin-bottom:4px">Uwagi (opcjonalnie)</label>
      <input id="zc-uwagi" type="text" placeholder="np. pilne, numer katalogowy..." style="width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;font-size:.95rem;outline:none">
    </div>
    <button id="zc-btn" onclick="wyslijZamowienie()" style="width:100%;padding:14px;background:#ea580c;color:white;border:none;border-radius:12px;font-size:1rem;font-weight:800;cursor:pointer">
      Wyślij zamówienie
    </button>
  </div>
</div>

<script>
'use strict';

const STATUSY = ['Przyjęto','W naprawie','Czeka na części','Gotowe','Wydano'];
const STATUS_CLS = {'Przyjęto':'s-przyjeto','W naprawie':'s-naprawa','Czeka na części':'s-czesci','Gotowe':'s-gotowe','Wydano':'s-wydano'};

let view = 'lista';
let zlecenieId = null;
let mechanicy = [];
let selMechId = null;
let filterStatus = 'Wszystkie';
let filterMoje = false;
let search = '';
let stack = [];
let currentMech = null; // zalogowany mechanik

async function api(method, path, body) {
  const opts = { method, headers: {'Content-Type':'application/json'}, cache: 'no-store' };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

function toast(msg, dur = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), dur);
}

function badge(status) {
  return `<span class="s-badge ${STATUS_CLS[status]||'s-wydano'}">${status}</span>`;
}

function fmt(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit',year:'numeric'});
}

function setTop(title, sub, back) {
  document.getElementById('topbarTitle').textContent = title;
  document.getElementById('topbarSub').textContent = sub||'';
  document.getElementById('backBtn').style.display = back ? 'block' : 'none';
}

function setNav(v) {
  ['lista','nowe','stat','ustawienia'].forEach(n =>
    document.getElementById('nav-'+n)?.classList.toggle('active', n === v));
  const subViews = ['szczegoly','edytuj','czesci','smtp','mechanicy-edit','dodaj-mech'];
  document.getElementById('bottomnav').style.display = subViews.includes(v) ? 'none' : 'flex';
}

function nav(v, id) {
  const mainViews = ['lista','nowe','stat','ustawienia'];
  if (!mainViews.includes(v)) stack.push(view);
  else stack = [];
  view = v;
  zlecenieId = id || null;
  selMechId = null;
  render();
}

function goBack() {
  const prev = stack.pop();
  if (!prev) { nav('lista'); return; }
  view = prev;
  render();
}

function render() {
  setNav(view);
  const map = {
    lista: renderLista, szczegoly: () => renderSzczegoly(zlecenieId),
    edytuj: () => renderEdytuj(zlecenieId), czesci: () => renderCzesci(zlecenieId),
    nowe: renderNowe, stat: renderStat,
    ustawienia: renderUstawienia, smtp: renderSmtp,
    'mechanicy-edit': renderMechanicyEdit, 'dodaj-mech': renderDodajMechanika,
  };
  (map[view] || renderLista)();
}

// ─── WYBÓR MECHANIKA (LOGIN) ──────────────────────────────────────────────────

function renderLogin() {
  document.getElementById('bottomnav').style.display = 'none';
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('topbarTitle').textContent = 'Agroserwis Serwis';
  document.getElementById('topbarSub').textContent = 'Wybierz swoje konto';
  const c = document.getElementById('content');
  if (!mechanicy.length) {
    c.innerHTML = `<div class="empty"><div class="empty-icon">👷</div><div style="font-size:1rem;font-weight:700;color:#1e293b;margin-bottom:8px">Brak mechaników</div><div style="font-size:.85rem">Zaloguj się jako administrator</div><div style="padding:24px 20px 0"><button class="btn-green" onclick="loginAsAdmin()">Wejdź jako admin</button></div></div>`;
    return;
  }
  const cards = mechanicy.map(m => `
    <div onclick="loginAs(${m.id})" style="background:#fff;border-radius:16px;padding:18px 20px;margin:0 12px 10px;box-shadow:0 1px 6px rgba(0,0,0,.09);display:flex;align-items:center;gap:14px;cursor:pointer">
      <div style="width:48px;height:48px;border-radius:50%;background:${m.kolor||'#16a34a'};display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.3rem;font-weight:900;flex-shrink:0">${(m.nazwa||'?')[0].toUpperCase()}</div>
      <div style="flex:1"><div style="font-size:1rem;font-weight:800;color:#1e293b">${m.nazwa}</div><div style="font-size:.78rem;color:#94a3b8;margin-top:2px">Mechanik</div></div>
      <div style="font-family:monospace;font-size:1.1rem;font-weight:900;color:#cbd5e1">${String(m.id).padStart(2,'0')}</div>
    </div>`).join('');
  c.innerHTML = `
    <div style="padding:24px 0 10px;text-align:center;color:#64748b;font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700">Wybierz konto</div>
    ${cards}
    <div style="padding:8px 12px 0">
      <div style="background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,.07)">
        <div style="font-size:.72rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:8px">Wpisz kod z komputera</div>
        <div style="display:flex;gap:8px">
          <input id="loginCodeInput" type="number" placeholder="np. 01" style="flex:1;border:2px solid #e2e8f0;border-radius:10px;padding:10px 12px;font-size:1.1rem;font-family:monospace;font-weight:700;outline:none;text-align:center" onkeydown="if(event.key==='Enter')loginByCode()">
          <button onclick="loginByCode()" style="background:#16a34a;color:#fff;border:none;border-radius:10px;padding:10px 18px;font-weight:800;font-size:.9rem;cursor:pointer">Wejdź</button>
        </div>
      </div>
    </div>
    <div style="padding:10px 12px 0"><button class="btn-gray" onclick="loginAsAdmin()">🔧 Wejdź jako administrator</button></div>
    <div style="height:24px"></div>`;
}

function loginAs(mechId) {
  const m = mechanicy.find(x => x.id === mechId);
  if (!m) return;
  currentMech = m;
  localStorage.setItem('currentMechId', String(mechId));
  filterMoje = true;
  document.getElementById('bottomnav').style.display = 'flex';
  nav('lista');
}

function loginByCode() {
  const code = parseInt(document.getElementById('loginCodeInput')?.value);
  if (!code) { toast('Wpisz numer kodu'); return; }
  const m = mechanicy.find(x => x.id === code);
  if (!m) { toast('Nieznany kod — sprawdź numer'); return; }
  loginAs(m.id);
}

function loginAsAdmin() {
  currentMech = null;
  localStorage.removeItem('currentMechId');
  filterMoje = false;
  document.getElementById('bottomnav').style.display = 'flex';
  nav('lista');
}

function wyloguj() {
  currentMech = null;
  localStorage.removeItem('currentMechId');
  filterMoje = false;
  mechanicy = [];
  init();
}

// ─── LISTA ────────────────────────────────────────────────────────────────────

async function renderLista() {
  const sub = currentMech ? currentMech.nazwa : 'Administrator';
  setTop('Zlecenia', sub, false);
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="search-wrap">
      <div class="search-bar"><input class="search-input" id="si" type="search" placeholder="Szukaj klienta, nr, marki..." value="${search}"></div>
      <div class="filter-scroll" id="fs"></div>
    </div>
    <div id="li"><div class="loading">Ładowanie...</div></div>`;
  document.getElementById('si').addEventListener('input', e => { search = e.target.value; loadLista(); });
  const fs = document.getElementById('fs');

  if (currentMech) {
    const bMoje = document.createElement('button');
    bMoje.className = 'chip' + (filterMoje ? ' active' : '');
    bMoje.textContent = '👤 Moje';
    bMoje.onclick = () => { filterMoje = !filterMoje; bMoje.classList.toggle('active', filterMoje); loadLista(); };
    fs.appendChild(bMoje);
  }

  ['Wszystkie','Przyjęto','W naprawie','Czeka na części','Gotowe','Wydano'].forEach(s => {
    const b = document.createElement('button');
    b.className = 'chip'+(s===filterStatus?' active':'');
    b.textContent = s;
    b.onclick = () => { filterStatus = s; fs.querySelectorAll('.chip:not(:first-child)').forEach(x => x.classList.remove('active')); b.classList.add('active'); loadLista(); };
    fs.appendChild(b);
  });
  loadLista();
}

async function loadLista() {
  const p = new URLSearchParams();
  if (filterStatus !== 'Wszystkie') p.set('status', filterStatus);
  if (search) p.set('szukaj', search);

  c.innerHTML = data.map(z => {
    const sp = [z.marka,z.model].filter(Boolean).join(' ')||'—';
    const mech = mechanicy.find(m => m.id === z.mechanik_id);
    const mechDot = mech ? `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${mech.kolor||'#16a34a'};margin-right:4px"></span>${mech.nazwa}` : '';

      <div class="card-sprzet">${sp}${mechDot ? `<span style="margin-left:8px;font-size:.7rem;color:#94a3b8">${mechDot}</span>` : ''}</div>
      <div class="card-date">${fmt(z.data_przyjecia)}</div>
    </div>`;

}

async function wyslijEmail(id) {
  const btn = document.getElementById('emailBtn');

  btn.textContent = 'Wysyłanie...'; btn.disabled = true;
  try {
    const r = await api('POST', `/api/email/${id}`);

  } catch(e) { toast('Błąd wysyłki'); }

async function usunZlecenie(id) {

  await api('DELETE', `/api/zlecenia/${id}`);

      <div class="section-title">Lista mechaników</div>

      <button class="btn-green" onclick="nav('dodaj-mech')">+ Dodaj mechanika</button>

}

// ─── DODAJ MECHANIKA ──────────────────────────────────────────────────────────

  setTop('Dodaj mechanika','',true);

    <div class="section" style="margin-top:12px">

      <div class="section-title" style="margin-bottom:10px">Kolor</div>

function selColor(c) {

async function dodajMechanika() {

  if (!nazwa) { toast('Wpisz imię i nazwisko'); return; }

  if (res?.id) {
    mechanicy = await api('GET','/api/mechanicy');
    toast('Mechanik dodany ✓');

// ─── ZDJĘCIA ─────────────────────────────────────────────────────────────────

let _photoZId = null;
let _photoTyp = 'przed';
let _allPhotos = [];

async function loadPhotos(zId) {
  _photoZId = zId;
  _allPhotos = await api('GET', `/api/zdjecia?zlecenie_id=${zId}`).catch(() => []);
  renderPhotoGrid();
}

function switchPhotoTab(typ, zId) {
  _photoTyp = typ;
  document.querySelectorAll('.photo-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('ptab-' + typ)?.classList.add('active');
  _photoZId = zId;
  renderPhotoGrid();
}

function renderPhotoGrid() {
  const grid = document.getElementById('photoGrid');
  if (!grid) return;
  const filtered = _allPhotos.filter(p => p.typ === _photoTyp);
  const base = location.origin;
  let html = filtered.map(p => `
    <div class="photo-thumb" onclick="openLightbox('${base}${p.url}')">
      <img src="${base}${p.url}" loading="lazy">
      <button class="photo-del" onclick="event.stopPropagation();usunZdjecie(${p.id})">✕</button>
    </div>`).join('');
  html += `<label class="photo-add"><input type="file" accept="image/*" onchange="onPhotoChosen(event)"><div class="photo-add-icon">📷</div><span>Dodaj</span></label>`;
  grid.innerHTML = `<div class="photo-grid">${html}</div>`;
}

function onPhotoChosen(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    const data = e.target.result;
    const compressedData = await compressImage(data, 1200, 0.82);
    toast('Wysyłanie...');
    try {
      await api('POST', '/api/zdjecia', { zlecenie_id: _photoZId, typ: _photoTyp, data: compressedData });
      _allPhotos = await api('GET', `/api/zdjecia?zlecenie_id=${_photoZId}`);
      renderPhotoGrid();
      toast('Zdjęcie dodane ✓');
    } catch(e) { toast('Błąd wysyłania'); }
  };
  reader.readAsDataURL(file);
}

function compressImage(dataUrl, maxSize, quality) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxSize || h > maxSize) {
        if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
        else { w = Math.round(w * maxSize / h); h = maxSize; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
  });
}

async function usunZdjecie(id) {
  if (!confirm('Usunąć to zdjęcie?')) return;
  await api('DELETE', `/api/zdjecia/${id}`);
  _allPhotos = _allPhotos.filter(p => p.id !== id);
  renderPhotoGrid();
  toast('Usunięto');
}

function openLightbox(url) {
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightbox').style.display = 'flex';
}
function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────

function v(id) { return document.getElementById(id)?.value?.trim()||''; }
function esc(s) { return (s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// ─── INIT ─────────────────────────────────────────────────────────────────────

async function init() {
  mechanicy = await api('GET','/api/mechanicy').catch(()=>[]);

  // Auto-login przez URL param ?m=ID lub ?m=admin (z kodu QR lub wpisanego kodu)
  const urlM = new URLSearchParams(location.search).get('m');
  if (urlM) {
    history.replaceState(null, '', location.pathname);
    if (urlM === 'admin') {
      document.getElementById('bottomnav').style.display = 'flex';
      loginAsAdmin();
      return;
    }
    localStorage.setItem('currentMechId', urlM);
  }

  const savedId = localStorage.getItem('currentMechId');
  if (savedId === 'admin') {
    localStorage.removeItem('currentMechId');
    document.getElementById('bottomnav').style.display = 'flex';
    loginAsAdmin();
    return;
  }
  if (savedId) {
    const m = mechanicy.find(x => x.id === parseInt(savedId));
    if (m) {
      currentMech = m;
      filterMoje = true;
      document.getElementById('bottomnav').style.display = 'flex';
      render();
      return;
    }
  }
  renderLogin();
}

// ── Zamów część ──────────────────────────────────────────────────────
let zamowZlecenieId = null;

function otworzZamowCzesc(zlecenieId) {
  zamowZlecenieId = zlecenieId;
  document.getElementById('zc-nazwa').value = '';
  document.getElementById('zc-ilosc').value = '1';
  document.getElementById('zc-uwagi').value = '';
  const modal = document.getElementById('modalZamow');
  modal.style.display = 'flex';
  setTimeout(() => document.getElementById('zc-nazwa').focus(), 100);
}

function zamknijZamow() {
  document.getElementById('modalZamow').style.display = 'none';
  zamowZlecenieId = null;
}

async function wyslijZamowienie() {
  const nazwa = document.getElementById('zc-nazwa').value.trim();
  if (!nazwa) { document.getElementById('zc-nazwa').focus(); return; }
  const ilosc = parseInt(document.getElementById('zc-ilosc').value) || 1;
  const uwagi = document.getElementById('zc-uwagi').value.trim();
  const btn = document.getElementById('zc-btn');
  btn.disabled = true; btn.textContent = '⏳ Wysyłanie...';
  try {
    await api('POST', '/api/zamowienia-czesci', {
      zlecenie_id: zamowZlecenieId,
      nazwa_czesci: nazwa,
      ilosc,
      uwagi,
      mechanik_id: currentMech ? currentMech.id : null,
      mechanik_nazwa: currentMech ? currentMech.nazwa : 'Administrator',
    });
    zamknijZamow();
    toast('Zamówienie wysłane do sklepu ✓');
  } catch(e) {
    toast('Błąd: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Wyślij zamówienie';
  }
}

init();
</script>
