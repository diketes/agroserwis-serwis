<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#16a34a">
  <title>Status naprawy — Agroserwis Nysa</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #16a34a; --green-dark: #15803d;
      --slate-50: #f8fafc; --slate-100: #f1f5f9; --slate-200: #e2e8f0;
      --slate-400: #94a3b8; --slate-500: #64748b; --slate-700: #334155;
      --slate-800: #1e293b; --slate-900: #0f172a;
    }

    html { height: 100%; -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100%; min-height: -webkit-fill-available;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--slate-100); color: var(--slate-800);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #16a34a, #15803d);
      padding: max(48px, env(safe-area-inset-top) + 14px) 20px 28px;
      text-align: center; color: white;
    }
    .header-logo {
      width: 56px; height: 56px; border-radius: 16px;
      background: rgba(255,255,255,.18); margin: 0 auto 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; border: 1.5px solid rgba(255,255,255,.3);
    }
    .header-brand { font-size: 1.2rem; font-weight: 800; margin-bottom: 2px; }
    .header-sub { font-size: .78rem; color: rgba(255,255,255,.65); }

    /* ── Main card ── */
    .card-container {
      max-width: 480px; margin: -14px auto 0; padding: 0 16px 40px;
      position: relative;
    }

    .status-card {
      background: white; border-radius: 18px;
      padding: 22px 20px; margin-bottom: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.1);
    }

    /* ── Greeting ── */
    .greeting { font-size: .82rem; color: var(--slate-400); margin-bottom: 4px; }
    .order-num { font-family: monospace; font-size: 1.3rem; font-weight: 900; color: var(--green); }

    /* ── Status badge ── */
    .status-badge {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 16px; border-radius: 100px;
      font-size: .88rem; font-weight: 800; margin: 14px 0;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .s-przyjeto  { background: #dbeafe; color: #1d4ed8; }
    .s-naprawie  { background: #fef9c3; color: #854d0e; }
    .s-czesci    { background: #ffedd5; color: #9a3412; }
    .s-gotowe    { background: #dcfce7; color: #15803d; }
    .s-wydano    { background: #f1f5f9; color: #475569; }
    .dot-przyjeto { background: #1d4ed8; }
    .dot-naprawie { background: #854d0e; }
    .dot-czesci   { background: #9a3412; }
    .dot-gotowe   { background: #15803d; }
    .dot-wydano   { background: #475569; }

    /* ── Progress steps ── */
    .progress-wrap { margin: 18px 0 6px; }
    .steps {
      display: flex; align-items: center; gap: 0;
      position: relative;
    }
    .step {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;
      position: relative; z-index: 1;
    }
    .step-circle {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .68rem; font-weight: 800;
      background: var(--slate-100); color: var(--slate-400);
      border: 2px solid var(--slate-200); transition: all .3s;
      position: relative;
    }
    .step-circle.done { background: var(--green); color: white; border-color: var(--green); }
    .step-circle.active { background: white; color: var(--green); border-color: var(--green); border-width: 3px; }
    .step-circle.done::after {
      content: '✓'; font-size: .7rem;
    }
    .step-label { font-size: .58rem; font-weight: 700; color: var(--slate-400); text-align: center; line-height: 1.2; }
    .step-label.done { color: var(--green); }
    .step-label.active { color: var(--green); font-weight: 800; }

    .step-line {
      flex: 1; height: 2px; background: var(--slate-200);
      position: absolute; top: 14px; left: calc(50% + 16px); right: calc(-50% + 16px);
      z-index: 0;
    }
    .step-line.done { background: var(--green); }

    /* ── Info rows ── */
    .info-section { border-top: 1px solid var(--slate-100); margin-top: 16px; padding-top: 14px; }
    .info-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 0; font-size: .88rem;
    }
    .info-row + .info-row { border-top: 1px solid var(--slate-50); }
    .info-label { color: var(--slate-500); }
    .info-val { font-weight: 700; color: var(--slate-800); text-align: right; }

    /* ── Status message card ── */
    .msg-card {
      border-radius: 14px; padding: 16px;
      font-size: .86rem; font-weight: 600; line-height: 1.4;
      margin-bottom: 12px;
    }
    .msg-gotowe { background: #dcfce7; color: #15803d; border: 2px solid #86efac; }
    .msg-naprawie { background: #fef9c3; color: #854d0e; }
    .msg-przyjeto { background: #dbeafe; color: #1d4ed8; }
    .msg-czesci { background: #ffedd5; color: #9a3412; }
    .msg-wydano { background: var(--slate-100); color: var(--slate-500); }
    .msg-icon { font-size: 1.4rem; display: block; margin-bottom: 6px; }

    /* ── Footer ── */
    .footer-card {
      background: white; border-radius: 14px; padding: 16px;
      text-align: center; font-size: .78rem; color: var(--slate-400);
      box-shadow: 0 2px 8px rgba(0,0,0,.06); line-height: 1.6;
    }
    .footer-brand { font-weight: 800; color: var(--slate-600); font-size: .84rem; margin-bottom: 4px; }
    .refresh-info { margin-top: 12px; font-size: .7rem; color: var(--slate-300); }

    /* ── Error state ── */
    .error-state {
      text-align: center; padding: 60px 20px; color: var(--slate-400);
    }
    .error-icon { font-size: 3rem; margin-bottom: 12px; }
    .error-title { font-size: 1rem; font-weight: 700; color: var(--slate-600); margin-bottom: 6px; }
    .error-sub { font-size: .84rem; }

    /* ── Loading ── */
    .loading {
      text-align: center; padding: 60px 20px; color: var(--slate-400);
      font-size: .9rem;
    }
    .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid var(--slate-200); border-top-color: var(--green);
      animation: spin .8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-logo">⚙</div>
    <div class="header-brand">Agroserwis Nysa</div>
    <div class="header-sub">Śledzenie statusu naprawy</div>
  </div>

  <div class="card-container">
    <div id="app">
      <div class="status-card">
        <div class="loading">
          <div class="spinner"></div>
          Ładowanie statusu...
        </div>
      </div>
    </div>
  </div>

  <script>
    const STATUS_ORDER = ['Przyjęto', 'W naprawie', 'Czeka na części', 'Gotowe', 'Wydano'];
    const STATUS_CSS = {
      'Przyjęto':        { badge: 's-przyjeto', dot: 'dot-przyjeto', msg: 'msg-przyjeto', icon: '📬', text: 'Twój sprzęt został przyjęty do serwisu i czeka na diagnozę.' },
      'W naprawie':      { badge: 's-naprawie', dot: 'dot-naprawie', msg: 'msg-naprawie', icon: '🔧', text: 'Nasz mechanik aktualnie pracuje nad Twoim sprzętem.' },
      'Czeka na części': { badge: 's-czesci',   dot: 'dot-czesci',   msg: 'msg-czesci',   icon: '📦', text: 'Zamówiliśmy niezbędne części. Naprawa zostanie wznowiona po ich dostarczeniu.' },
      'Gotowe':          { badge: 's-gotowe',   dot: 'dot-gotowe',   msg: 'msg-gotowe',   icon: '✅', text: 'Twój sprzęt jest gotowy do odbioru! Zapraszamy do serwisu.' },
      'Wydano':          { badge: 's-wydano',   dot: 'dot-wydano',   msg: 'msg-wydano',   icon: '🏠', text: 'Sprzęt został wydany. Dziękujemy za skorzystanie z naszych usług!' },
    };

    const token = window.location.pathname.replace('/sledz/', '').replace(/\//g, '');
    let refreshTimer = null;
    let countdown = 10;

    function fmt(iso) {
      if (!iso) return null;
      return new Date(iso).toLocaleString('pl-PL', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function stepHtml(label, idx, currentIdx) {
      const done   = idx < currentIdx;
      const active = idx === currentIdx;
      const cls    = done ? 'done' : active ? 'active' : '';
      const labelCls = done ? 'done' : active ? 'active' : '';
      const lineClass = idx < currentIdx ? 'step-line done' : 'step-line';
      const circleContent = done ? '' : (idx + 1);
      return `
        <div class="step" style="position:relative">
          <div class="step-circle ${cls}">${circleContent}</div>
          <div class="step-label ${labelCls}">${label.replace(' ', '<br>')}</div>
          ${idx < STATUS_ORDER.length - 1 ? `<div class="${lineClass}"></div>` : ''}
        </div>`;
    }

    function render(data) {
      const cfg = STATUS_CSS[data.status] || STATUS_CSS['Przyjęto'];
      const stepIdx = STATUS_ORDER.indexOf(data.status);
      const sprzet = [data.marka, data.model].filter(Boolean).join(' ') || '—';
      const isGotowe = data.status === 'Gotowe';

      const stepsHtml = STATUS_ORDER.map((s, i) => stepHtml(s, i, stepIdx)).join('');

      document.getElementById('app').innerHTML = `
        ${isGotowe ? `<div class="msg-card ${cfg.msg}">
          <span class="msg-icon">${cfg.icon}</span>
          <strong>${cfg.text}</strong>
        </div>` : ''}

        <div class="status-card">
          ${data.klient_imie ? `<div class="greeting">Witaj, ${data.klient_imie}!</div>` : ''}
          <div class="order-num">${data.numer}</div>

          <div class="status-badge ${cfg.badge}">
            <div class="status-dot ${cfg.dot}"></div>
            ${data.status}
          </div>

          <div class="progress-wrap">
            <div class="steps">${stepsHtml}</div>
          </div>

          ${!isGotowe ? `<div class="msg-card ${cfg.msg}" style="margin-top:14px;margin-bottom:0">
            <span class="msg-icon">${cfg.icon}</span>
            ${cfg.text}
          </div>` : ''}

          <div class="info-section">
            <div class="info-row">
              <span class="info-label">Sprzęt</span>
              <span class="info-val">${sprzet}</span>
            </div>
            ${data.nr_seryjny ? `<div class="info-row">
              <span class="info-label">Nr seryjny</span>
              <span class="info-val" style="font-family:monospace">${data.nr_seryjny}</span>
            </div>` : ''}
            <div class="info-row">
              <span class="info-label">Przyjęto</span>
              <span class="info-val">${fmt(data.data_przyjecia) || '—'}</span>
            </div>
            ${data.data_gotowosci ? `<div class="info-row">
              <span class="info-label">Gotowe od</span>
              <span class="info-val" style="color:#15803d">${fmt(data.data_gotowosci)}</span>
            </div>` : ''}
            ${data.data_wydania ? `<div class="info-row">
              <span class="info-label">Wydano</span>
              <span class="info-val">${fmt(data.data_wydania)}</span>
            </div>` : ''}
          </div>
        </div>

        <div class="footer-card">
          <div class="footer-brand">Agroserwis Nysa</div>
          ul. Dmowskiego 2, 48-303 Nysa<br>
          Tel: 880 109 005
          <div class="refresh-info" id="refreshInfo">Odświeżam za <span id="countdownEl">10</span>s</div>
        </div>
      `;

      startCountdown();
    }

    function renderError() {
      document.getElementById('app').innerHTML = `
        <div class="status-card">
          <div class="error-state">
            <div class="error-icon">🔍</div>
            <div class="error-title">Nie znaleziono zlecenia</div>
            <div class="error-sub">Sprawdź poprawność kodu QR lub skontaktuj się z serwisem.</div>
          </div>
        </div>
        <div class="footer-card">
          <div class="footer-brand">Agroserwis Nysa</div>
          ul. Dmowskiego 2, 48-303 Nysa · Tel: 880 109 005
        </div>
      `;
    }

    function startCountdown() {
      clearInterval(refreshTimer);
      countdown = 10;
      refreshTimer = setInterval(() => {
        countdown--;
        const el = document.getElementById('countdownEl');
        if (el) el.textContent = countdown;
        if (countdown <= 0) { clearInterval(refreshTimer); load(); }
      }, 1000);
    }

    async function load() {
      try {
        const r = await fetch('/api/sledz/' + token, { cache: 'no-store' });
        if (!r.ok) { renderError(); return; }
        const data = await r.json();
        render(data);
      } catch (e) {
        // If offline, show last state
        const app = document.getElementById('app');
        if (!app.innerHTML.includes('status-card') || app.innerHTML.includes('loading')) renderError();
        startCountdown();
      }
    }

    load();
  </script>
</body>
</html>
