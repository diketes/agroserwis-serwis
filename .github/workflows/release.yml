name: Release (Windows)

# Wypchnięcie tagu v* buduje instalator Windows i dołącza go do Release.
# Assety Release nie zużywają limitu miejsca na artefakty Actions,
# więc ten workflow nie wpadnie w problem ze storage jak stare buildy.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24: electron-builder ciągnie zależność ESM-only (@noble/hashes),
          # której Node 20 nie potrafi wczytać przez require() → build padał.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer + portable
        shell: pwsh
        run: |
          $env:DEBUG = "electron-builder"
          npx electron-builder --win --x64 *>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      # Diagnostyka: przy błędzie wypchnij log builda na osobną gałąź do odczytu
      - name: Log przy błędzie
        if: failure()
        shell: pwsh
        run: |
          git config user.name "ci"
          git config user.email "ci@agroserwis"
          $b = "cilog-${{ github.run_id }}"
          git checkout -b $b
          git add -f build.log
          git commit -m "log builda ${{ github.run_id }}"
          git push origin $b

      - name: Publish release with installers
        uses: softprops/action-gh-release@v2
        with:
          name: Agroserwis Serwis ${{ github.ref_name }}
          files: |
            dist/*Setup*.exe
            dist/*portable*.exe
          body: |
            ## Agroserwis Serwis — Windows

            **Do pobrania:**
            - `Agroserwis.Serwis.Setup.*.exe` — instalator (zalecany)
            - `AgroserwisServis-portable.exe` — wersja przenośna, bez instalacji

            Aktualizacja zaproponuje się sama po uruchomieniu aplikacji.
