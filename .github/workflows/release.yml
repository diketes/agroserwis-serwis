name: Release (Windows)

# Wypchnięcie tagu v* buduje instalator Windows i dołącza go do Release.
# Assety Release nie zużywają limitu miejsca na artefakty Actions,
# więc ten workflow nie wpadnie w problem ze storage jak stare buildy.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ponawiamy — electron-builder czasem nie dociągnie narzędzi z sieci przy 1. próbie
      - name: Build Windows installer + portable
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "Build — próba $i/3"
            npx electron-builder --win --x64
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Start-Sleep -Seconds 15
          }
          if (-not $ok) { throw "Build nie powiódł się po 3 próbach" }

      - name: Publish release with installers
        uses: softprops/action-gh-release@v2
        with:
          name: Agroserwis Serwis ${{ github.ref_name }}
          files: |
            dist/*Setup*.exe
            dist/*portable*.exe
          body: |
            ## Agroserwis Serwis — Windows

            **Do pobrania:**
            - `Agroserwis.Serwis.Setup.*.exe` — instalator (zalecany)
            - `AgroserwisServis-portable.exe` — wersja przenośna, bez instalacji

            Aktualizacja zaproponuje się sama po uruchomieniu aplikacji.
